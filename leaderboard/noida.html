<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noida | Leaderboard</title>
  <meta name="description" content="Live Noida leaderboard for Delhi Padel Collective.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=14">
</head>
<body data-page="noida">
  <aside class="left-sidebar">
    <div class="sidebar-brand">
      <img class="sidebar-logo" src="dpc-logo.svg" alt="Delhi Padel Collective">
      <div class="sidebar-sub">Leaderboard</div>
    </div>
    <nav class="sidebar-nav">
      <a class="sidebar-link" href="/">
        <svg viewBox="0 0 24 24"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/><polyline points="9 21 9 12 15 12 15 21"/></svg>
        <span>Home</span>
      </a>
      <a class="sidebar-link" href="/Dashboard/">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        <span>Overview</span>
      </a>
      <a class="sidebar-link active" href="/leaderboard/">
        <svg viewBox="0 0 24 24"><rect x="18" y="3" width="3" height="18"/><rect x="11" y="8" width="3" height="13"/><rect x="4" y="13" width="3" height="8"/></svg>
        <span>Leaderboard</span>
      </a>
      <a class="sidebar-link" href="/calender/">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/></svg>
        <span>Games</span>
      </a>
    </nav>
    <div class="sidebar-foot">
      <button class="sidebar-signout" onclick="localStorage.removeItem('dpcPlayerSession');localStorage.removeItem('dpcPlayerPhone');sessionStorage.removeItem('dpcDemo');location.href='/login/'">Sign Out</button>
    </div>
  </aside>

  <main class="page-wrap">
    <section class="leaderboard-card">
      <header class="topbar">
        <div class="brand-lockup">
        <a class="brand-link" href="https://www.padelcollectiveindia.com/">
            <img class="brand-logo" src="dpc-green-logo.svg" alt="Delhi Padel Collective logo">
          </a>
        </div>

        <div class="topbar-tools">
          <label class="page-switcher">
            <span class="sr-only">Select leaderboard</span>
            <select id="pageSelector" aria-label="Select leaderboard page">
              <option value="index.html">First Serve</option>
              <option value="breakpoint.html">Break Point</option>
              <option value="matchpoint.html">Match Point</option>
              <option value="noida.html">Noida</option>
            </select>
          </label>
          <div class="topbar-meta">
            <p>Leaderboard</p>
          </div>
        </div>
      </header>

      <section class="hero-banner">
        <p class="slash">//</p>
        <div class="hero-copy">
          <h1>Noida</h1>
          <p>Leaderboard</p>
        </div>
      </section>

      <section class="standings-section">
        <div class="standings-head">
          <div>
            <p class="section-kicker">Overall Standings</p>
          </div>
          <button id="refreshButton" class="refresh-button" type="button" hidden>Refresh</button>
        </div>

        <div id="statusMessage" class="status-message" aria-live="polite"></div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th class="rank-col">#</th>
                <th>Player</th>
                <th>MP</th>
                <th>PTS</th>
              </tr>
            </thead>
            <tbody id="rankingBody">
              <tr>
                <td colspan="4">Loading leaderboard...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

      <footer class="card-footer">
        <div class="footer-rule"></div>
        <p class="footer-note">MP = matches played · PTS = total score points</p>
        <div class="footer-meta">
          <span>Delhi//PadelCollective</span>
          <span>@DELHIPADELCOLLECTIVE</span>
        </div>
      </footer>
    </section>
  </main>

  <div class="bottom-nav" role="navigation" aria-label="Primary">
    <a class="bnav-tab" href="/">
      <svg viewBox="0 0 24 24"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/><polyline points="9 21 9 12 15 12 15 21"/></svg>
      <span>Home</span>
    </a>
    <a class="bnav-tab" href="/Dashboard/">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      <span>Overview</span>
    </a>
    <a class="bnav-tab active" href="/leaderboard/">
      <svg viewBox="0 0 24 24"><rect x="18" y="3" width="3" height="18"/><rect x="11" y="8" width="3" height="13"/><rect x="4" y="13" width="3" height="8"/></svg>
      <span>Leaderboard</span>
    </a>
    <a class="bnav-tab" href="/calender/">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/></svg>
      <span>Games</span>
    </a>
  </div>

  <script src="script.js?v=14"></script>
</body>
</html>

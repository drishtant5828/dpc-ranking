<!DOCTYPE html>
<html lang="en">
<head>
<script src="../../errors.js?v=1"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Registrations closed · Delhi Padel League</title>
<meta name="description" content="Delhi Padel League Season One player registrations are closed.">
<meta name="theme-color" content="#f1ece0">
<link rel="icon" href="../../img/crest.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=EB+Garamond:wght@500;600;700&family=Albert+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../league.css?v=5">
<style>
.reg{max-width:720px;margin-inline:auto;padding:12px var(--pad) 80px}
.reg-nav{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;height:84px}
.reg-nav .brand{justify-self:center;font-size:clamp(22px,3vw,28px);gap:14px}
.reg-nav .brand .crest{width:56px;height:56px}
/* The name sits dead centre; the crest hangs to its left. */
.reg-nav .brand{position:relative;gap:0}
.reg-nav .brand .crest{position:absolute;right:calc(100% + 14px);top:50%;transform:translateY(-50%)}
.reg .hint{font-size:14px;color:var(--text-3);line-height:1.45}
.reg .days{display:none}
.reg .days.on{display:flex}
@media(max-width:599px){.reg .dates{font-size:14px}.reg .dates b{min-width:108px}.reg-nav{height:72px}.reg-nav .brand{font-size:20px}.reg-nav .brand .crest{width:40px;height:40px;right:calc(100% + 10px)}}
.reg-card{background:var(--surface);padding:clamp(20px,4vw,40px)}
.reg .f{padding:0}
.reg .done{padding:8px 0}
.reg .closed{display:grid;gap:16px}
</style>
</head>
<body>
<header id="nav">
  <div class="wrap reg-nav">
    <span></span>
    <a href="../" class="brand"><img class="crest" src="../../img/crest.jpg" alt="" width="56" height="56">Delhi Padel League</a>
    <a href="../" aria-label="Back" onclick="if(history.length>1&&document.referrer){history.back();return false}" style="font-size:22px;line-height:1;text-decoration:none;color:var(--text);padding:8px">←</a>
  </div>
</header>
<main class="reg">
  <h1 class="sr-only" style="position:absolute;left:-9999px">Player registrations closed, Delhi Padel League Season One</h1>
  <div class="reg-card closed">
    <p class="eyebrow">Season One</p>
    <h2>Player registrations are closed.</h2>
    <p class="lead">Thank you to everyone who registered. Franchises pick their squads at Auction Night on 1st November, and we'll be in touch on WhatsApp after that.</p>
    <p><a class="btn btn-primary" href="../">Back to the league</a></p>
  </div>
</main>
<script src="../track.js?v=2"></script>
<script src="../faq.js?v=5"></script>
<script src="/site-footer.js?v=3" defer></script>
</body>
</html>
